version: '3.8'

# Red News Local Development Environment
# Start: docker-compose up
# Cleanup: docker-compose down -v

services:
  # ============ PostgreSQL Database ============
  postgres:
    image: postgres:15-alpine
    container_name: red-news-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: red_news
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      # Locale for proper sorting
      POSTGRES_INITDB_ARGS: "-c lc_collate=C"
    volumes:
      # Persist data between restarts
      - postgres_data:/var/lib/postgresql/data
      # Optional: init SQL scripts
      # - ./server/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d red_news"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - red_news_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============ Redis Cache ============
  redis:
    image: redis:7-alpine
    container_name: red-news-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - red_news_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: redis-server --appendonly yes --loglevel notice

  # ============ NestJS Backend API ============
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        - NODE_ENV=development
    container_name: red-news-backend
    ports:
      - "3000:3000"
    environment:
      # Server
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: "http://localhost:3000,http://localhost:3001,chrome-extension://*"

      # Database
      DATABASE_URL: postgresql://dev_user:dev_password@postgres:5432/red_news

      # Cache
      REDIS_URL: redis://redis:6379

      # Auth
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_EXPIRES_IN: 7d

      # Google OAuth (get from Google Cloud Console)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # Trading Economics API
      TRADING_ECONOMICS_TOKEN: ${TRADING_ECONOMICS_TOKEN:-}

      # Telegram Bot (optional)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-http://localhost:3000/api/v1/telegram/webhook}

      # Logging
      LOG_LEVEL: debug

    volumes:
      # Hot reload source code
      - ./server/src:/app/src
      # Node modules (avoid syncing)
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - red_news_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

    # Development: watch mode with hot reload
    command: sh -c "npm run prisma:generate && npm run dev"

    # Uncomment for production:
    # command: npm run start:prod

  # ============ Optional: Adminer (Database GUI) ============
  adminer:
    image: adminer:latest
    container_name: red-news-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      - postgres
    networks:
      - red_news_network
    restart: unless-stopped
    profiles:
      - debug  # Only start with: docker-compose --profile debug up

# ============ Volumes ============
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ============ Networks ============
networks:
  red_news_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
