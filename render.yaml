# Red News Render Deployment Config
# © 2026 Yuriy Orekhov. All rights reserved.
#
# Deploy instructions:
# 1. Commit and push this file to GitHub
# 2. Connect your repository to render.com
# 3. Render will auto-detect this config
# 4. Click "Deploy" in Render dashboard

services:
  # ============ NestJS Backend ============
  - type: web
    name: red-news-api
    runtime: node
    plan: free

    # Git
    repo: https://github.com/yuriy-o/rednews
    branch: main
    rootDir: server

    # Build
    buildCommand: bash render-build.sh
    startCommand: npm run start:prod

    # Environment
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        # ВАЖНО: Set this in Render dashboard (Secret Env Var)
        scope: PROJECT
      - key: CORS_ORIGIN
        value: https://rednews.app,https://app.rednews.app,chrome-extension://*

    # Database connection
    # NOTE: Add DATABASE_URL as Secret Env Var in Render dashboard
    # Render will create PostgreSQL and provide the URL automatically

    # Health check
    healthCheckPath: /health
    healthCheckInterval: 30
    healthCheckTimeout: 5

    # Instance settings
    scaling:
      minInstances: 1
      maxInstances: 1  # Free tier: 1 instance only

  # ============ PostgreSQL Database ============
  - type: pserv
    name: red-news-postgres
    plan: free
    ipAllowList: []  # Allow all IPs (internally only)

    # Database
    database: red_news
    user: postgres
    # Password auto-generated by Render

    # Encryption
    postgresMajorVersion: 15

# ============ Environment Variables (Secrets) ============
# Add these as "Secret Env Vars" in Render Dashboard:
#
# DATABASE_URL=
#   → Render auto-generates when PostgreSQL is created
#   → Format: postgresql://postgres:password@host:5432/red_news
#
# JWT_SECRET=
#   → Generate: openssl rand -hex 32
#   → KEEP SECRET! Don't commit to repo
#
# GOOGLE_CLIENT_ID= (optional, for OAuth)
# GOOGLE_CLIENT_SECRET= (optional, for OAuth)
# TRADING_ECONOMICS_TOKEN= (optional, for calendar API)
# TELEGRAM_BOT_TOKEN= (optional, for Telegram alerts)
